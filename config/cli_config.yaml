# =============================================================================
# VNPY 统一 CLI 默认配置
# =============================================================================
# 可通过命令行参数覆盖:
#   vnpy --config /path/to/custom_config.yaml
#
# 版本: 1.1
# 最后更新: 2026-06-21
# =============================================================================

log:
  level: INFO               # DEBUG | INFO | WARNING | ERROR
  format: text              # text | json
  dir: ./logs
  rotation: 100MB
  retention: 30             # days

runtime:
  default_timeout: 600      # seconds
  max_workers: 4

# 旧脚本目录 (wrapper 调用)
legacy:
  scripts_dir: examples/alpha_research
  python: python3
  cwd: examples/alpha_research

# 数据源 fallback
data_source:
  primary: tushare
  fallback: akshare
  circuit_breaker:
    failure_threshold: 3
    recovery_time: 300      # seconds
