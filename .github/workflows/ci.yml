name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'design/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_integration:
        description: '运行集成测试（需 secrets）'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_DEFAULT: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ===========================================================================
  # Job 1: Lint (最快，~10s)
  # ===========================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.6.0"

      - name: ruff check
        run: ruff check alpha/ core/ cli/ tests/

      - name: ruff format --check
        run: ruff format --check alpha/ core/ cli/ tests/

  # ===========================================================================
  # Job 2: Type check (可选，非阻塞)
  # ===========================================================================
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true   # 项目类型注解不完整，先记录不阻塞
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install mypy
        run: pip install "mypy>=1.10" types-PyYAML types-click
      - name: mypy
        run: |
          mypy alpha/ core/ cli/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --show-error-codes \
            --pretty

  # ===========================================================================
  # Job 3: Test (矩阵，覆盖 4 个 Python 版本)
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit + CLI tests
        env:
          # CI 中显式禁用外部数据源
          TUSHARE_TOKEN: ''
          BAOSTOCK_ENABLED: 'false'
        run: |
          pytest tests/unit tests/cli \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            -ra -q \
            --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Upload coverage to artifacts
        if: matrix.python-version == env.PYTHON_DEFAULT
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            junit-${{ matrix.python-version }}.xml

      - name: Annotate PR with coverage
        if: github.event_name == 'pull_request' && matrix.python-version == env.PYTHON_DEFAULT
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage.xml', 'utf8');
            const match = coverage.match(/line-rate="([0-9.]+)"/);
            const rate = match ? (parseFloat(match[1]) * 100).toFixed(2) : 'N/A';
            // 查找已有的覆盖率评论，避免刷屏
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body && c.body.includes('Coverage Report'));
            const body = `📊 **Coverage Report**\n\nLine coverage: **${rate}%**\n\n<details><summary>Details</summary>\n\nSee \`coverage-report\` artifact for full report.</details>`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ===========================================================================
  # Job 4: Build (验证包可正常打包)
  # ===========================================================================
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install build
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify build artifacts
        run: |
          ls -la dist/
          python -m zipfile -l dist/*.whl | head -20
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ===========================================================================
  # Job 5: Integration (可选，默认禁用)
  # ===========================================================================
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_integration)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: 'pip'
      - name: Install
        run: |
          pip install -e ".[test]"
      - name: Run integration tests
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          AKSHARE_PROXY: ${{ secrets.AKSHARE_PROXY }}
        run: |
          pytest tests/integration -v --tb=short -ra
        continue-on-error: true   # 数据源依赖外部 API，失败不阻塞合并
